name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: "Publish docs and test report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: wyvox/action@v2
      - run: pnpm build
      # A failed run still publishes, so failures can be inspected.
      - run: pnpm test:report || true
      - name: Check that a report was written
        run: test -f .vitest/index.html || { echo "::error::vitest wrote no report. See the test:report step."; exit 1; }
      - run: pnpm docs:build
      # The test report is served from the tests/ sub-path of the docs.
      - run: cp -r .vitest docs/.vitepress/dist/tests
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - id: deploy
        uses: actions/deploy-pages@v5
